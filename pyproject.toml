[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomvid"
version = "0.1.0"
description = "Pluggable Video-Context Module Infrastructure for Frozen VLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision",
    "transformers>=4.45.0",
    "accelerate>=0.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zoomvid*"]


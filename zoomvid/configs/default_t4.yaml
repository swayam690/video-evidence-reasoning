# Default configuration for ZoomVid with Qwen2.5-VL-3B-Instruct on Colab T4

backbone:
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  torch_dtype: "fp16"           # fp16 required for Colab T4
  device_map: "auto"
  attn_implementation: "sdpa"   # Use SDPA or eager on T4 (flash_attn requires Ampere+)
  vision_token_pooling: true

model:
  in_features: 2048             # Vision encoder patch merger output dim
  out_features: 2048            # LLM hidden size for Qwen2.5-VL-3B
  token_budget: 2048            # Default max visual tokens
  budget_range: [1024, 4096]    # Dynamic token budget range during training

cache:
  fps: 1.0                      # Target sampling rate
  resolution: [336, 336]        # Standard input resolution
  shard_size_mb: 500            # Target size per shard
  cache_dir: "cache/qwen2_5_vl_3b"

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 1000
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  seed: 42

